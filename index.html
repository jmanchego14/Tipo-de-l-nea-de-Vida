<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Caída Libre - Haug S.A.</title>
    <style>
        :root {
            --primary-red: #d32f2f;
            --primary-dark: #0f172a;
            --bg: #f8fafc;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: #334155;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }

        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary-red);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .header-box h2 {
            color: var(--primary-dark);
            margin: 0;
            font-size: 1.4rem;
            text-transform: uppercase;
        }

        .header-box img {
            height: 48px;
            width: auto;
        }

        .section-title {
            font-weight: 700;
            color: var(--primary-red);
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-red);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }

        .btn-calc {
            background-color: var(--primary-red);
            color: white;
        }

        .btn-calc:hover {
            background-color: #b71c1c;
        }

        .btn-pdf {
            background-color: var(--primary-dark);
            color: white;
            display: none;
        }

        .btn-pdf:hover {
            background-color: #1e293b;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            display: none;
            text-align: center;
        }

        .result-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1d4ed8;
        }

        /* Configuración de Impresión / Guardado en PDF */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
                border: none;
                max-width: 100%;
            }
            .btn, input {
                border: none;
                background: transparent;
            }
            .btn-calc, .btn-pdf {
                display: none !important;
            }
            input {
                font-weight: bold;
            }
        }
    </style>
</head>
<body>

<div class="container" id="reporte">
    <div class="header-box">
        <div>
            <h2>Cálculo de Caída Libre</h2>
            <small style="color: #64748b;">Evaluación Tecno-Operativa de Seguridad</small>
        </div>
        <img src="haug.png" alt="Haug Logo">
    </div>

    <div class="section-title">1. Datos del Trabajador y Área</div>
    <div class="grid-2">
        <div class="form-group">
            <label>Nombres y Apellidos:</label>
            <input type="text" id="nombre" placeholder="Ej. Juan Pérez">
        </div>
        <div class="form-group">
            <label>DNI / Documento:</label>
            <input type="text" id="dni" placeholder="Ej. 72849103">
        </div>
    </div>
    <div class="grid-2">
        <div class="form-group">
            <label>Empresa:</label>
            <input type="text" id="empresa" value="Haug S.A.">
        </div>
        <div class="form-group">
            <label>Área / Trabajo:</label>
            <input type="text" id="area" placeholder="Ej. Mantenimiento">
        </div>
    </div>

    <div class="section-title">2. Parámetros Técnicos del Sistema Anticaídas</div>
    <div class="grid-2">
        <div class="form-group">
            <label>Línea de Anclaje - L (m):</label>
            <input type="number" id="longitud" step="0.1" value="1.8">
        </div>
        <div class="form-group">
            <label>Absorbedor Impacto - E (m):</label>
            <input type="number" id="elongacion" step="0.1" value="1.2">
        </div>
    </div>
    <div class="grid-2">
        <div class="form-group">
            <label>Altura Argolla Dorsal - H (m):</label>
            <input type="number" id="estatura" step="0.1" value="1.5">
        </div>
        <div class="form-group">
            <label>Factor Seguridad - FS (m):</label>
            <input type="number" id="seguridad" step="0.1" value="1.0">
        </div>
    </div>
    <div class="form-group">
        <label>Altura Libre Disponible en Trabajo (m):</label>
        <input type="number" id="disponible" step="0.1" placeholder="Ej. 6.0">
    </div>

    <button class="btn btn-calc" onclick="calcularDAC()">Calcular DAC</button>

    <div class="result-box" id="resultado">
        <div>Distancia Absoluta de Caída Requerida:</div>
        <div class="result-value" id="dac-valor">0.00 m</div>
        <div id="dac-status" style="margin-top: 8px; font-weight: bold;"></div>
    </div>

    <button class="btn btn-pdf" id="btnExportar" onclick="window.print()">Guardar / Imprimir Reporte PDF</button>
</div>

<script>
    function calcularDAC() {
        const L = parseFloat(document.getElementById('longitud').value) || 0;
        const E = parseFloat(document.getElementById('elongacion').value) || 0;
        const H = parseFloat(document.getElementById('estatura').value) || 0;
        const FS = parseFloat(document.getElementById('seguridad').value) || 0;
        const Disp = parseFloat(document.getElementById('disponible').value);

        const dac = L + E + H + FS;

        document.getElementById('dac-valor').innerText = dac.toFixed(2) + " m";
        
        const statusDiv = document.getElementById('dac-status');
        if (!isNaN(Disp)) {
            if (dac <= Disp) {
                statusDiv.innerHTML = "<span style='color: #15803d;'>✓ SISTEMA SEGURO (DAC &le; Altura Disponible)</span>";
            } else {
                statusDiv.innerHTML = "<span style='color: #b91c1c;'>✕ RIESGO DE CAÍDA (DAC supera la Altura Disponible)</span>";
            }
        } else {
            statusDiv.innerHTML = "";
        }

        document.getElementById('resultado').style.display = 'block';
        document.getElementById('btnExportar').style.display = 'block';
    }
</script>

</body>
</html>
