<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Caída Libre - Haug S.A.</title>
    <style>
        :root {
            --primary-red: #d32f2f;
            --primary-dark: #0f172a;
            --bg: #f8fafc;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: #334155;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }

        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary-red);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .header-box h2 {
            color: var(--primary-dark);
            margin: 0;
            font-size: 1.4rem;
            text-transform: uppercase;
        }

        .header-box img {
            height: 48px;
            width: auto;
        }

        .section-title {
            font-weight: 700;
            color: var(--primary-red);
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #475569;
        }

        input, select {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.9rem;
            background-color: #fff;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-red);
        }

        .preset-info {
            background-color: #f1f5f9;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #475569;
            margin-bottom: 12px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }

        .btn-calc {
            background-color: var(--primary-red);
            color: white;
        }

        .btn-calc:hover {
            background-color: #b71c1c;
        }

        .btn-pdf {
            background-color: var(--primary-dark);
            color: white;
            display: none;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            display: none;
            text-align: center;
        }

        .result-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1d4ed8;
        }

        .recommendation {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: left;
            line-height: 1.4;
        }

        .rec-safe {
            background-color: #dcfce7;
            color: #14532d;
            border: 1px solid #86efac;
        }

        .rec-danger {
            background-color: #fef2f2;
            color: #7f1d1d;
            border: 1px solid #fca5a5;
        }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; max-width: 100%; }
            .btn { display: none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <div>
            <h2>Cálculo de Caída Libre</h2>
            <small style="color: #64748b;">Evaluación Tecno-Operativa de Seguridad</small>
        </div>
        <img src="haug.png" alt="Haug Logo">
    </div>

    <div class="section-title">1. Datos del Trabajador</div>
    <div class="grid-2">
        <div class="form-group">
            <label>Nombres y Apellidos:</label>
            <input type="text" id="nombre" placeholder="Ej. Juan Pérez">
        </div>
        <div class="form-group">
            <label>DNI / Documento:</label>
            <input type="text" id="dni" placeholder="Ej. 72849103">
        </div>
    </div>

    <div class="section-title">2. Selección de Sistema y Medidas de Campo</div>
    
    <div class="form-group">
        <label>Tipo de Sistema Anticaídas:</label>
        <select id="tipoAutoadhesivo" onchange="actualizarPresets()">
            <option value="absorbedor">Línea con Absorbedor de Impacto</option>
            <option value="restriccion">Línea de Restricción</option>
            <option value="retractil">Bloque Retráctil</option>
        </select>
    </div>

    <div class="preset-info" id="preset-texto">
        <strong>Valores Predeterminados:</strong> Lanyard = 1.80m | Absorbedor = 1.20m | Altura Dorsal = 1.50m | Margen de Seguridad = 1.00m
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label>Posicionamiento del Trabajador (m):</label>
            <input type="number" id="posicionamiento" step="0.1" placeholder="Nivel de pies (Ej. 1.8)">
        </div>
        <div class="form-group">
            <label>Altura Punto de Anclaje (m):</label>
            <input type="number" id="anclaje" step="0.1" placeholder="Ej. 3.3">
        </div>
    </div>

    <button class="btn btn-calc" onclick="evaluarSeguridad()">Calcular y Evaluar Sistema</button>

    <div class="result-box" id="resultado">
        <div>Distancia Absoluta de Caída Requerida (DAC):</div>
        <div class="result-value" id="dac-valor">0.00 m</div>
        <div id="dac-status" style="margin-top: 8px; font-weight: bold;"></div>
        <div id="recomendacion-box" class="recommendation"></div>
    </div>

    <button class="btn btn-pdf" id="btnExportar" onclick="window.print()">Guardar / Imprimir Reporte PDF</button>
</div>

<script>
    const configs = {
        restriccion: { L: 1.8, E: 0.0, H: 1.5, FS: 1.0, label: "Lanyard = 1.80m | Absorbedor = 0.00m | Altura Dorsal = 1.50m | Margen = 1.00m" },
        absorbedor:  { L: 1.8, E: 1.2, H: 1.5, FS: 1.0, label: "Lanyard = 1.80m | Absorbedor = 1.20m | Altura Dorsal = 1.50m | Margen = 1.00m" },
        retractil:   { L: 0.8, E: 0.4, H: 1.5, FS: 1.0, label: "Freno Retráctil = 0.80m | Elongación = 0.40m | Altura Dorsal = 1.50m | Margen = 1.00m" }
    };

    function actualizarPresets() {
        const sistema = document.getElementById('tipoAutoadhesivo').value;
        document.getElementById('preset-texto').innerHTML = "<strong>Valores Predeterminados:</strong> " + configs[sistema].label;
    }

    function evaluarSeguridad() {
        const sistema = document.getElementById('tipoAutoadhesivo').value;
        const posPies = parseFloat(document.getElementById('posicionamiento').value) || 0;
        const altAnclaje = parseFloat(document.getElementById('anclaje').value) || 0;

        const cfg = configs[sistema];
        const dacRequerido = cfg.L + cfg.E + cfg.H + cfg.FS;
        const alturaDisponible = altAnclaje; 

        document.getElementById('dac-valor').innerText = dacRequerido.toFixed(2) + " m";

        const statusDiv = document.getElementById('dac-status');
        const recBox = document.getElementById('recomendacion-box');

        if (alturaDisponible >= dacRequerido) {
            statusDiv.innerHTML = "<span style='color: #15803d;'>✓ SISTEMA SEGURO</span>";
            recBox.className = "recommendation rec-safe";
            recBox.innerHTML = "<strong>💡 Recomendación:</strong> El punto de anclaje proporciona la distancia de caída requerida (" + dacRequerido.toFixed(2) + " m). Se autoriza el trabajo con el sistema seleccionado.";
        } else {
            statusDiv.innerHTML = "<span style='color: #b91c1c;'>✕ RIESGO DE CAÍDA / IMPACTO</span>";
            recBox.className = "recommendation rec-danger";
            
            let sugerencia = "";
            if (sistema === "absorbedor") {
                sugerencia = "Cambiar a un <strong>Bloque Retráctil</strong> para reducir la distancia de caída a 3.70 m, o subir el punto de anclaje por encima de la cabeza.";
            } else if (sistema === "restriccion") {
                sugerencia = "Ajustar la longitud de la línea a una medida menor para evitar que el trabajador alcance el borde desprotegido.";
            } else {
                sugerencia = "Elevar el punto de anclaje a una estructura superior o utilizar una línea de vida vertical rigidizada.";
            }

            recBox.innerHTML = "<strong>⚠️ Recomendación Operativa:</strong> La altura libre de anclaje (" + alturaDisponible.toFixed(2) + " m) es inferior al mínimo seguro (" + dacRequerido.toFixed(2) + " m). <br><br><strong>Solución propuesta:</strong> " + sugerencia;
        }

        document.getElementById('resultado').style.display = 'block';
        document.getElementById('btnExportar').style.display = 'block';
    }
</script>

</body>
</html>
