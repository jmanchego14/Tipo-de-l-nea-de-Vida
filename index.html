<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAUG - Validación de Línea de Vida</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --primary: #dc2626; /* Rojo corporativo HAUG */
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-dark); padding: 15px; display: flex; justify-content: center; }
        .container { max-width: 900px; width: 100%; display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .container { grid-template-columns: 1fr 1fr; } }

        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .brand-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        .brand-title { font-weight: bold; font-size: 1.1rem; color: var(--primary); letter-spacing: 0.5px; }
        h1 { font-size: 1.2rem; color: var(--text-dark); margin-bottom: 4px; }
        p.subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
        .input-row { display: flex; align-items: center; gap: 10px; }
        input[type="range"] { flex: 1; accent-color: var(--primary); }
        input[type="number"] { width: 80px; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; text-align: center; }

        .result-box { padding: 15px; border-radius: 10px; border-left: 6px solid #cbd5e1; background: #f8fafc; transition: all 0.3s ease; margin-bottom: 15px; }
        .result-box.danger { border-color: var(--danger); background: #fef2f2; color: #991b1b; }
        .result-box.warning { border-color: var(--warning); background: #fffbeb; color: #92400e; }
        .result-box.success { border-color: var(--success); background: #f0fdf4; color: #166534; }
        
        .result-title { font-weight: bold; font-size: 1.05rem; margin-bottom: 4px; }
        .result-desc { font-size: 0.85rem; line-height: 1.35; }

        .visual-container { display: flex; flex-direction: column; align-items: center; justify-content: space-between; background: #ffffff; gap: 15px; }
        canvas { width: 100%; max-width: 340px; height: 380px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; }

        .footer-banner { background: #0f172a; color: #ffffff; padding: 12px 16px; border-radius: 8px; text-align: center; font-size: 0.85rem; font-weight: bold; border-left: 4px solid var(--primary); width: 100%; margin-top: auto; }
    </style>
</head>
<body>

<div class="container">
    <!-- Panel de Datos -->
    <div class="card">
        <div class="brand-header">
            <span class="brand-title">HAUG &bull; SST</span>
            <span style="font-size: 0.75rem; background: #fee2e2; color: #991b1b; padding: 3px 8px; border-radius: 4px; font-weight: bold;">Trabajos en Altura</span>
        </div>

        <h1>Validación de Línea de Vida</h1>
        <p class="subtitle">Ingrese las alturas para verificar la distancia de caída requerida.</p>

        <div class="form-group">
            <label for="slider-posicion">1. Altura de pies del trabajador / Nivel de trabajo (m)</label>
            <div class="input-row">
                <input type="range" id="slider-posicion" min="0" max="25" step="0.5" value="4.5">
                <input type="number" id="num-posicion" min="0" max="25" step="0.5" value="4.5">
            </div>
        </div>

        <div class="form-group">
            <label for="slider-anclaje">2. Altura del Punto de Anclaje (m)</label>
            <div class="input-row">
                <input type="range" id="slider-anclaje" min="0" max="30" step="0.5" value="6.0">
                <input type="number" id="num-anclaje" min="0" max="30" step="0.5" value="6.0">
            </div>
        </div>

        <div id="result-box" class="result-box success">
            <div class="result-title" id="res-title">Cargando...</div>
            <div class="result-desc" id="res-desc">Calculando parámetros...</div>
        </div>
    </div>

    <!-- Panel Gráfico Dinámico -->
    <div class="card visual-container">
        <canvas id="schemaCanvas" width="340" height="380"></canvas>
        
        <!-- Frase Preventiva al Pie -->
        <div class="footer-banner">
            "Para no llegar al piso y golpearte, el conector de anclaje adecuado debes colocarte"
        </div>
    </div>
</div>

<script>
    const REQUERIMIENTO_CLARIDAD_ABSORBEDOR = 5.70;

    const inputs = {
        posicion: { slider: document.getElementById('slider-posicion'), num: document.getElementById('num-posicion') },
        anclaje: { slider: document.getElementById('slider-anclaje'), num: document.getElementById('num-anclaje') }
    };

    const resBox = document.getElementById('result-box');
    const resTitle = document.getElementById('res-title');
    const resDesc = document.getElementById('res-desc');
    const canvas = document.getElementById('schemaCanvas');
    const ctx = canvas.getContext('2d');

    function syncInputs(key, src) {
        if (src === 'slider') {
            inputs[key].num.value = inputs[key].slider.value;
        } else {
            inputs[key].slider.value = inputs[key].num.value;
        }
        calculate();
    }

    Object.keys(inputs).forEach(key => {
        inputs[key].slider.addEventListener('input', () => syncInputs(key, 'slider'));
        inputs[key].num.addEventListener('input', () => syncInputs(key, 'num'));
    });

    function calculate() {
        const hPosicion = parseFloat(inputs.posicion.num.value) || 0;
        let hAnclaje = parseFloat(inputs.anclaje.num.value) || 0;

        if (hAnclaje < hPosicion) {
            hAnclaje = hPosicion;
            inputs.anclaje.num.value = hAnclaje;
            inputs.anclaje.slider.value = hAnclaje;
        }

        let status = '';
        let title = '';
        let desc = '';

        if (hAnclaje >= 6.0 && hAnclaje >= REQUERIMIENTO_CLARIDAD_ABSORBEDOR) {
            status = 'success';
            title = 'Puede usar Línea de Vida con Absorbedor de Impacto';
            desc = `La altura del anclaje (${hAnclaje.toFixed(2)}m) cumple con el requerimiento de claridad de 5.70m (Línea: 1.8m + Absorbedor: 1.2m + Estatura: 1.7m + Margen: 1.0m). Es seguro el uso de línea con absorbedor.`;
        } else if (hAnclaje >= 2.5) {
            status = 'warning';
            title = 'Uso Obligatorio de Línea de Vida Retráctil';
            desc = `La altura de anclaje (${hAnclaje.toFixed(2)}m) es menor a los 6.0m requeridos para absorbedor de impacto. Debe emplear un sistema retráctil para limitar la distancia de caída.`;
        } else {
            status = 'danger';
            title = '¡ALERTA RIESGO CRÍTICO DE IMPACTO!';
            desc = `La altura de anclaje (${hAnclaje.toFixed(2)}m) es insuficiente. El trabajador impactará contra el piso antes de frenar. Eleve la posición del punto de anclaje.`;
        }

        resBox.className = `result-box ${status}`;
        resTitle.textContent = title;
        resDesc.textContent = desc;

        drawDiagram(hPosicion, hAnclaje, status);
    }

    function drawDiagram(hPos, hAnc, status) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const margin = 40;
        const maxHeight = Math.max(hAnc + 1.5, 8);
        const scaleY = (canvas.height - 2 * margin) / maxHeight;

        const getY = (val) => canvas.height - margin - (val * scaleY);
        const centerX = canvas.width / 2;

        // 1. Suelo
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(20, canvas.height - margin);
        ctx.lineTo(canvas.width - 20, canvas.height - margin);
        ctx.stroke();

        // Etiqueta del suelo
        ctx.fillStyle = '#64748b';
        ctx.font = '10px sans-serif';
        ctx.fillText('Nivel 0.0m (Piso)', 25, canvas.height - margin + 15);

        // 2. Plataforma / Estructura de Trabajo
        const yPos = getY(hPos);
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(centerX - 60, yPos);
        ctx.lineTo(centerX + 60, yPos);
        ctx.stroke();

        // 3. Dibujar al Trabajador Ilustrado (Estatura 1.70m)
        const alturaPersonaPx = 1.70 * scaleY;
        const yPies = yPos;
        const yCabeza = yPies - alturaPersonaPx;
        const yCintura = yPies - (alturaPersonaPx * 0.5);
        const yHombros = yCabeza + (alturaPersonaPx * 0.2);
        const yArgollaDorsal = yHombros + 5; // Punto donde se conecta la línea

        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 3;
        ctx.fillStyle = '#0f172a';

        // Cabeza
        ctx.beginPath();
        ctx.arc(centerX, yCabeza + 6, 7, 0, Math.PI * 2);
        ctx.fill();

        // Casco de seguridad (Amarillo SST)
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(centerX, yCabeza + 4, 8, Math.PI, 0);
        ctx.fill();

        // Cuerpos y extremidades
        ctx.beginPath();
        // Tronco
        ctx.moveTo(centerX, yCabeza + 13);
        ctx.lineTo(centerX, yCintura);
        // Piernas
        ctx.lineTo(centerX - 10, yPies);
        ctx.moveTo(centerX, yCintura);
        ctx.lineTo(centerX + 10, yPies);
        // Brazos
        ctx.moveTo(centerX - 12, yHombros + 10);
        ctx.lineTo(centerX, yHombros);
        ctx.lineTo(centerX + 12, yHombros + 10);
        ctx.stroke();

        // Arnés de Seguridad (Líneas rojas en el cuerpo)
        ctx.strokeStyle = '#dc2626';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(centerX - 6, yHombros);
        ctx.lineTo(centerX + 6, yCintura);
        ctx.moveTo(centerX + 6, yHombros);
        ctx.lineTo(centerX - 6, yCintura);
        ctx.stroke();

        // 4. Punto de Anclaje
        const yAnc = getY(hAnc);
        let statusColor = status === 'danger' ? '#ef4444' : (status === 'warning' ? '#f59e0b' : '#10b981');

        // Soporte/Estructura del Anclaje
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(centerX - 25, yAnc - 8);
        ctx.lineTo(centerX + 25, yAnc - 8);
        ctx.stroke();

        // Conector / Anclaje
        ctx.fillStyle = statusColor;
        ctx.beginPath();
        ctx.arc(centerX, yAnc, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 5. Línea de Vida conectada (Anclaje -> Argolla Dorsal del trabajador)
        ctx.strokeStyle = statusColor;
        ctx.lineWidth = 3;
        ctx.setLineDash([4, 3]);
        ctx.beginPath();
        ctx.moveTo(centerX, yAnc);
        ctx.lineTo(centerX, yArgollaDorsal);
        ctx.stroke();
        ctx.setLineDash([]); // Restablecer línea sólida

        // Etiquetas indicativas en la ilustración
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText(`Anclaje (${hAnc.toFixed(1)}m)`, centerX + 32, yAnc + 4);
        ctx.fillText(`Pies (${hPos.toFixed(1)}m)`, centerX + 65, yPos + 4);
    }

    calculate();
</script>
</body>
</html>
